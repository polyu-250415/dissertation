<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1776" height="888" viewBox="0 0 1776 888" role="img" aria-labelledby="title desc">
  <title id="title">Framework-Guided Knowledge Digital Shadow Architecture</title>
  <desc id="desc">A three-stage architecture diagram showing a provenance-linked knowledge digital shadow, template-guided interpretation, and synthesis and prospective use.</desc>

  <defs>
    <style>
      .title { font: 700 42px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #08285c; letter-spacing: -1px; }
      .panel-heading { font: 700 19px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #ffffff; }
      .panel-subheading { font: italic 15px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #ffffff; }
      .box-title { font: 700 18px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #15346b; }
      .box-copy { font: 700 14px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #15346b; }
      .teal-title { font: 700 19px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #176576; }
      .teal-copy { font: 700 14px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #176576; }
      .small { font: 700 13px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #15346b; }
      .loop-label { font: 700 19px "Arial Narrow", "Aptos Narrow", Arial, sans-serif; fill: #173675; }
      .panel { fill: #ffffff; stroke: #092b6b; stroke-width: 2.5; }
      .header { fill: #05275d; }
      .blue-box { fill: #fbfdff; stroke: #6398ec; stroke-width: 2; }
      .navy-box { fill: #ffffff; stroke: #183778; stroke-width: 2.5; }
      .teal-box { fill: #fbffff; stroke: #42adba; stroke-width: 2; }
      .arrow { fill: none; stroke: #0a2e6b; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .line { fill: none; stroke: #0a2e6b; stroke-width: 2.5; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a2e6b"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0b2b61" flood-opacity="0.12"/>
    </filter>
    <clipPath id="panel1Clip"><rect x="22" y="90" width="614" height="652" rx="18"/></clipPath>
    <clipPath id="panel2Clip"><rect x="684" y="90" width="468" height="652" rx="18"/></clipPath>
    <clipPath id="panel3Clip"><rect x="1200" y="90" width="550" height="652" rx="18"/></clipPath>
  </defs>

  <rect width="1776" height="888" fill="#ffffff"/>
  <text x="888" y="60" text-anchor="middle" class="title">Template-Guided Knowledge Digital Shadow Architecture</text>

  <!-- Panel 1 -->
  <rect x="22" y="90" width="614" height="652" rx="18" class="panel" filter="url(#softShadow)"/>
  <rect x="22" y="90" width="614" height="70" class="header" clip-path="url(#panel1Clip)"/>
  <text x="329" y="119" text-anchor="middle" class="panel-heading">1. PROVENANCE-LINKED WORKFLOW</text>
  <text x="329" y="145" text-anchor="middle" class="panel-subheading">Versioned, time-stamped representation of selected published evidence</text>

  <rect x="42" y="187" width="172" height="162" rx="10" class="blue-box"/>
  <text x="128" y="218" text-anchor="middle" class="box-title">
    <tspan x="128">Publication-case</tspan><tspan x="128" dy="22">knowledge graphs</tspan>
  </text>
  <text x="128" y="282" text-anchor="middle" class="box-copy">
    <tspan x="128">One publication = one</tspan><tspan x="128" dy="19">case; provenance to</tspan><tspan x="128" dy="19">source passages</tspan>
  </text>

  <rect x="250" y="187" width="170" height="162" rx="10" class="blue-box"/>
  <text x="335" y="218" text-anchor="middle" class="box-title">
    <tspan x="335">Industry-level</tspan><tspan x="335" dy="22">knowledge graphs</tspan>
  </text>
  <text x="335" y="282" text-anchor="middle" class="box-copy">
    <tspan x="335">Aggregated within</tspan><tspan x="335" dy="19">SIC industry</tspan>
  </text>

  <rect x="456" y="187" width="162" height="162" rx="10" class="blue-box"/>
  <text x="537" y="213" text-anchor="middle" class="box-title">
    <tspan x="537">Cross-industry</tspan><tspan x="537" dy="22">comparison and</tspan><tspan x="537" dy="22">synthesis</tspan>
  </text>
  <text x="537" y="288" text-anchor="middle" class="box-copy">
    <tspan x="537">Recurring, partial, and</tspan><tspan x="537" dy="19">industry-specific</tspan><tspan x="537" dy="19">configurations</tspan>
  </text>

  <path d="M214 268 H250" class="arrow"/>
  <path d="M420 268 H456" class="arrow"/>

  <rect x="62" y="400" width="530" height="78" rx="8" class="blue-box"/>
  <text x="299" y="432" text-anchor="middle" class="box-title">Multiple-stage verification and alignment</text>
  <text x="299" y="460" text-anchor="middle" class="box-copy">Schema • Source grounding • Entity alignment•
    Downstream task</text>
  <path d="M128 400 V350" class="arrow"/>
  <path d="M335 400 V350" class="arrow"/>
  <path d="M537 400 V350" class="arrow"/>

  <rect x="62" y="524" width="530" height="64" rx="8" class="blue-box"/>
  <text x="299" y="560" text-anchor="middle" class="box-title">Multi-model extraction and structural diagnostics</text>
  <path d="M299 524 V479" class="arrow"/>

  <rect x="62" y="622" width="530" height="64" rx="8" class="blue-box"/>
  <text x="299" y="661" text-anchor="middle" class="box-title">Peer-reviewed empirical publications</text>
  <path d="M299 622 V589" class="arrow"/>

  <!-- Panel 2 -->
  <rect x="684" y="90" width="468" height="652" rx="18" class="panel" filter="url(#softShadow)"/>
  <rect x="684" y="90" width="468" height="70" class="header" clip-path="url(#panel2Clip)"/>
  <text x="918" y="131" text-anchor="middle" class="panel-heading">2. TEMPLATE-GUIDED INTERPRETATION</text>

  <rect x="712" y="195" width="412" height="88" rx="10" class="teal-box"/>
  <text x="918" y="229" text-anchor="middle" class="teal-title">Optimized Encoding Template</text>
  <text x="918" y="258" text-anchor="middle" class="teal-copy">Consistent evidence classification</text>
  <text x="918" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#092e6c">+</text>

  <rect x="712" y="348" width="412" height="88" rx="10" class="teal-box"/>
  <text x="918" y="383" text-anchor="middle" class="teal-title">Theory-informed Interpretive Strategy</text>
  <text x="918" y="412" text-anchor="middle" class="teal-copy">Organizes cues and identifies digital-era shifts</text>

  <path d="M918 436 V468 H802 V508" class="arrow"/>
  <path d="M918 468 H1031 V508" class="arrow"/>

  <rect x="712" y="513" width="180" height="124" rx="9" class="teal-box"/>
  <text x="793.5" y="551" text-anchor="middle" class="teal-title">RQ1</text>
  <text x="793.5" y="583" text-anchor="middle" class="teal-copy">
    <tspan x="793.5">Retention</tspan><tspan x="793.5" dy="20">mechanisms</tspan>
  </text>


  <rect x="940" y="513" width="180" height="124" rx="9" class="teal-box"/>
  <text x="1032" y="551" text-anchor="middle" class="teal-title">RQ2</text>
  <text x="1032" y="583" text-anchor="middle" class="teal-copy">
    <tspan x="1032">Resources &amp; capabilities</tspan><tspan x="1032"
                                                                                               dy="20">Organizational culture</tspan>
  </text>

  <text x="918" y="686" text-anchor="middle" class="small">Digitally reconfigured • Persistently established</text>

  <!-- Synthesis hand-off -->
  <path d="M1152 299 H1196" class="arrow"/>

  <!-- Panel 3 -->
  <rect x="1200" y="90" width="550" height="652" rx="18" class="panel" filter="url(#softShadow)"/>
  <rect x="1200" y="90" width="550" height="70" class="header" clip-path="url(#panel3Clip)"/>
  <text x="1475" y="131" text-anchor="middle" class="panel-heading">3. SYNTHESIS AND PROSPECTIVE USE</text>

  <rect x="1218" y="196" width="514" height="185" rx="12" class="teal-box"/>
  <text x="1475" y="230" text-anchor="middle" class="teal-title">Socio-Technical Co-adaptation Framework</text>

  <rect x="1233" y="253" width="220" height="109" rx="9" class="teal-box"/>
  <text x="1343" y="284" text-anchor="middle" class="teal-copy">Retention Mechanism</text>
  <text x="1343" y="314" text-anchor="middle" class="box-copy">
    <tspan x="1343">Experiential Amplification ↔</tspan><tspan x="1343" dy="22">Digital Codification</tspan>
  </text>

  <rect x="1488" y="253" width="228" height="109" rx="9" class="teal-box"/>
  <text x="1602" y="284" text-anchor="middle" class="teal-copy">Organizational &amp; Environmental
    Context</text>
  <text x="1602" y="314" text-anchor="middle" class="box-copy">
    <tspan x="1602">Digitally reconfigured ↔ </tspan><tspan x="1602" dy="22">Persistently established</tspan>
  </text>
  <path d="M1454 307 H1486" class="line"/>
  <path d="M1456 307 l10 -6 v12 z" fill="#0a2e6b"/>
  <path d="M1485 307 l-10 -6 v12 z" fill="#0a2e6b"/>

  <path d="M1334 362 V462" class="arrow"/>
  <path d="M1602 362 V462" class="arrow"/>

  <rect x="1218" y="473" width="240" height="212" rx="11" class="navy-box"/>
  <text x="1338" y="560" text-anchor="middle" class="box-title">
    <tspan x="1338">Detected shifts and</tspan><tspan x="1338" dy="25">updated empirical baseline</tspan>
  </text>

  <rect x="1490" y="473" width="242" height="212" rx="11" class="navy-box"/>
  <text x="1611" y="513" text-anchor="middle" class="box-title">
    <tspan x="1611">Mechanism-based</tspan><tspan x="1611" dy="24">cross-industry transfer</tspan><tspan x="1611" dy="24">propositions</tspan>
  </text>
  <text x="1611" y="602" text-anchor="middle" class="box-copy">
    <tspan x="1611">Prospective innovation</tspan><tspan x="1611" dy="23">target-context validation</tspan>
  </text>

  <!-- Framework-guided query from panel 1 to the interpretive template -->
  <path d="M683 392 H636" class="arrow"/>
  <text x="660" y="418" text-anchor="middle" class="small">
    <tspan x="660">Template-guided</tspan><tspan x="660" dy="23">querying</tspan>
  </text>

  <!-- Iterative evidence-update loop -->
  <path d="M1467 742 V770 Q1467 802 1435 802 H332 Q299 802 299 770 V687" class="arrow"/>
  <rect x="726" y="807" width="320" height="38" fill="#ffffff"/>
  <text x="886" y="837" text-anchor="middle" class="loop-label">Iterative evidence update</text>
</svg>
