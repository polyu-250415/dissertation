<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1300" viewBox="0 0 2600 1300" role="img" aria-labelledby="title desc">
  <title id="title">Research Toolchain Architecture</title>
  <desc id="desc">A left-to-right research toolchain showing case selection, case representation, industry-level coding, cross-industry coding, stage-gated validation, continuous researcher oversight, and two research outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#222222"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#777777"/>
    </marker>
    <style>
      .figure-title { font: 700 48px Arial, Helvetica, sans-serif; fill: #111111; }
      .figure-subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #555555; }
      .group-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #555555; letter-spacing: 1.4px; }
      .stage-number { font: 700 17px Arial, Helvetica, sans-serif; fill: #FFFFFF; letter-spacing: 1.2px; }
      .stage-title { font: 700 27px Arial, Helvetica, sans-serif; fill: #111111; }
      .task-label { font: 700 15px Arial, Helvetica, sans-serif; fill: #666666; letter-spacing: 1px; }
      .body { font: 400 18px Arial, Helvetica, sans-serif; fill: #222222; }
      .output-label { font: 700 14px Arial, Helvetica, sans-serif; fill: #555555; letter-spacing: 1px; }
      .output-text { font: 700 17px Arial, Helvetica, sans-serif; fill: #111111; }
      .gate { font: 700 13px Arial, Helvetica, sans-serif; fill: #111111; letter-spacing: .5px; }
      .pass { font: 700 13px Arial, Helvetica, sans-serif; fill: #555555; letter-spacing: 1px; }
      .lane-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #FFFFFF; letter-spacing: .6px; }
      .lane-subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #444444; }
      .check-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #111111; }
      .check-text { font: 400 16px Arial, Helvetica, sans-serif; fill: #333333; }
      .oversight-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #FFFFFF; letter-spacing: .4px; }
      .oversight-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #222222; }
      .research-output { font: 700 20px Arial, Helvetica, sans-serif; fill: #111111; }
      .research-output-small { font: 400 16px Arial, Helvetica, sans-serif; fill: #444444; }
      .note { font: 400 17px Arial, Helvetica, sans-serif; fill: #555555; }
    </style>
  </defs>

  <rect width="2600" height="1300" fill="#FFFFFF"/>

  <text x="1300" y="70" text-anchor="middle" class="figure-title">Research Toolchain Architecture</text>
  <text x="1300" y="108" text-anchor="middle" class="figure-subtitle">LLM-assisted evidence processing under stage-gated validation and continuous researcher oversight</text>
  <line x1="80" y1="145" x2="2520" y2="145" stroke="#B8B8B8" stroke-width="2"/>

  <!-- Workflow group labels -->
  <path d="M80,210 V188 H1990 V210" fill="none" stroke="#888888" stroke-width="1.5"/>
  <rect x="775" y="173" width="520" height="28" fill="#FFFFFF"/>
  <text x="1035" y="194" text-anchor="middle" class="group-label">LLM-ASSISTED ANALYTICAL WORKFLOW</text>
  <path d="M2190,210 V188 H2520 V210" fill="none" stroke="#888888" stroke-width="1.5"/>
  <rect x="2250" y="173" width="210" height="28" fill="#FFFFFF"/>
  <text x="2355" y="194" text-anchor="middle" class="group-label">RESEARCH OUTPUTS</text>

  <!-- Stage 1 -->
  <g transform="translate(80,250)">
    <rect x="0" y="0" width="380" height="310" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="48" fill="#222222"/>
    <text x="20" y="32" class="stage-number">STAGE 1</text>
    <text x="20" y="91" class="stage-title">Case Selection</text>
    <text x="20" y="128" class="task-label">RETRIEVE AND SCREEN</text>
    <text x="20" y="159" class="body">Scopus • Web of Science • PubMed</text>
    <text x="20" y="188" class="body">Unified search and inclusion strategy</text>
    <rect x="0" y="225" width="380" height="85" fill="#EFEFEF"/>
    <text x="20" y="252" class="output-label">OUTPUT</text>
    <text x="20" y="282" class="output-text">Evidence-rich candidate corpus</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(590,250)">
    <rect x="0" y="0" width="380" height="310" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="48" fill="#222222"/>
    <text x="20" y="32" class="stage-number">STAGE 2</text>
    <text x="20" y="91" class="stage-title">Case Representation</text>
    <text x="20" y="128" class="task-label">STRUCTURED EXTRACTION</text>
    <text x="20" y="159" class="body">Framework-guided entity and</text>
    <text x="20" y="188" class="body">relationship extraction</text>
    <rect x="0" y="225" width="380" height="85" fill="#EFEFEF"/>
    <text x="20" y="252" class="output-label">OUTPUT</text>
    <text x="20" y="282" class="output-text">Source-linked case knowledge graph</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(1100,250)">
    <rect x="0" y="0" width="380" height="310" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="48" fill="#222222"/>
    <text x="20" y="32" class="stage-number">STAGE 3</text>
    <text x="20" y="91" class="stage-title">Industry-level Coding</text>
    <text x="20" y="128" class="task-label">ALIGN AND CONSOLIDATE</text>
    <text x="20" y="159" class="body">Compare and merge case-level graphs;</text>
    <text x="20" y="188" class="body">align equivalent entities and terms</text>
    <rect x="0" y="225" width="380" height="85" fill="#EFEFEF"/>
    <text x="20" y="252" class="output-label">OUTPUT</text>
    <text x="20" y="282" class="output-text">Three industry-level practice maps</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(1610,250)">
    <rect x="0" y="0" width="380" height="310" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="48" fill="#222222"/>
    <text x="20" y="32" class="stage-number">STAGE 4</text>
    <text x="20" y="91" class="stage-title">Cross-Industry Coding</text>
    <text x="20" y="128" class="task-label">COMPARE AND INTEGRATE</text>
    <text x="20" y="159" class="body">Compare the three industry maps;</text>
    <text x="20" y="188" class="body">align recurring and distinctive concepts</text>
    <rect x="0" y="225" width="380" height="85" fill="#EFEFEF"/>
    <text x="20" y="252" class="output-label">OUTPUT</text>
    <text x="20" y="282" class="output-text">Multidisciplinary knowledge map</text>
  </g>

  <!-- Validation gates between stages -->
  <g>
    <path d="M460,405 H488" stroke="#222222" stroke-width="3"/>
    <path d="M523,380 L558,405 L523,430 L488,405 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="523" y="410" text-anchor="middle" class="gate">GATE</text>
    <path d="M558,405 H579" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="570" y="381" text-anchor="middle" class="pass">PASS</text>

    <path d="M970,405 H998" stroke="#222222" stroke-width="3"/>
    <path d="M1033,380 L1068,405 L1033,430 L998,405 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="1033" y="410" text-anchor="middle" class="gate">GATE</text>
    <path d="M1068,405 H1089" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1080" y="381" text-anchor="middle" class="pass">PASS</text>

    <path d="M1480,405 H1508" stroke="#222222" stroke-width="3"/>
    <path d="M1543,380 L1578,405 L1543,430 L1508,405 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="1543" y="410" text-anchor="middle" class="gate">GATE</text>
    <path d="M1578,405 H1599" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1590" y="381" text-anchor="middle" class="pass">PASS</text>

    <path d="M1990,405 H2020" stroke="#222222" stroke-width="3"/>
    <path d="M2055,380 L2090,405 L2055,430 L2020,405 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="2055" y="410" text-anchor="middle" class="gate">GATE</text>
    <path d="M2090,405 H2140" stroke="#222222" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="2115" y="381" text-anchor="middle" class="pass">PASS</text>
  </g>

  <!-- Research outputs -->
  <path d="M2140,405 H2165 V315 H2190" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M2165,405 V505 H2190" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(2200,245)">
    <path d="M0,0 H320 V145 C266,112 213,178 160,145 C107,112 54,178 0,145 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="24" y="47" class="research-output">Multidisciplinary</text>
    <text x="24" y="76" class="research-output">Knowledge Map</text>
    <text x="24" y="109" class="research-output-small">Traceable entities, relations,</text>
    <text x="24" y="131" class="research-output-small">cases, and source passages</text>
  </g>

  <g transform="translate(2200,435)">
    <path d="M0,0 H320 V145 C266,112 213,178 160,145 C107,112 54,178 0,145 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <text x="24" y="47" class="research-output">Researcher-Led</text>
    <text x="24" y="76" class="research-output">Interpretation</text>
    <text x="24" y="109" class="research-output-small">Contextualized patterns, limits,</text>
    <text x="24" y="131" class="research-output-small">and qualified research claims</text>
  </g>

  <!-- Gate-to-protocol links -->
  <path d="M523,430 V685" stroke="#777777" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <path d="M1033,430 V685" stroke="#777777" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <path d="M1543,430 V685" stroke="#777777" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
  <path d="M2055,430 V685" stroke="#777777" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>

  <!-- Validation protocol lane -->
  <g transform="translate(80,690)">
    <rect x="0" y="0" width="2440" height="260" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <rect x="0" y="0" width="2440" height="55" fill="#222222"/>
    <text x="24" y="36" class="lane-title">STAGE-GATED VALIDATION PROTOCOL</text>
    <text x="610" y="35" class="lane-subtitle" fill="#FFFFFF" style="fill:#FFFFFF">Criteria determine whether outputs progress, are revised, or are excluded</text>

    <line x1="488" y1="55" x2="488" y2="260" stroke="#C2C2C2" stroke-width="1.5"/>
    <line x1="998" y1="55" x2="998" y2="260" stroke="#C2C2C2" stroke-width="1.5"/>
    <line x1="1508" y1="55" x2="1508" y2="260" stroke="#C2C2C2" stroke-width="1.5"/>
    <line x1="2018" y1="55" x2="2018" y2="260" stroke="#C2C2C2" stroke-width="1.5"/>

    <text x="22" y="94" class="check-title">Selection reliability</text>
    <text x="22" y="126" class="check-text">Rule screening and deduplication</text>
    <text x="22" y="153" class="check-text">Dual-model retention and human audit</text>
    <text x="22" y="180" class="check-text">Full-text evidence sufficiency</text>

    <text x="510" y="94" class="check-title">Source fidelity</text>
    <text x="510" y="126" class="check-text">Schema and structural diagnostics</text>
    <text x="510" y="153" class="check-text">Source-grounded FactCheck</text>
    <text x="510" y="180" class="check-text">Entity alignment and conflict resolution</text>

    <text x="1020" y="94" class="check-title">Coding consistency</text>
    <text x="1020" y="126" class="check-text">Template refinement and coding audit</text>
    <text x="1020" y="153" class="check-text">Retrospective correction</text>
    <text x="1020" y="180" class="check-text">Framework-relative analytical coverage</text>

    <text x="1530" y="94" class="check-title">Cross-industry integration</text>
    <text x="1530" y="126" class="check-text">Inter-industry entity and relation alignment</text>
    <text x="1530" y="153" class="check-text">Recurrence, variation, and evidence-chain review</text>
    <text x="1530" y="180" class="check-text">Dependencies, boundaries, and counterevidence</text>

    <text x="2040" y="94" class="check-title">Claim authorization</text>
    <text x="2040" y="126" class="check-text">Traceability to supporting sources</text>
    <text x="2040" y="153" class="check-text">Researcher review of interpretations</text>
    <text x="2040" y="180" class="check-text">Qualified—not universally causal—claims</text>
  </g>

  <!-- Continuous researcher oversight lane -->
  <g transform="translate(80,990)">
    <rect x="0" y="0" width="2440" height="130" fill="#F0F0F0" stroke="#555555" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="130" fill="#444444"/>
    <text x="28" y="53" class="oversight-title">CONTINUOUS RESEARCHER</text>
    <text x="28" y="83" class="oversight-title">OVERSIGHT AND AUTHORITY</text>

    <text x="430" y="51" class="oversight-text">Defines coding framework</text>
    <text x="430" y="84" class="oversight-text">• audits screening and evidence</text>
    <text x="915" y="51" class="oversight-text">Resolves extraction conflicts</text>
    <text x="915" y="84" class="oversight-text">• refines categories and terminology</text>
    <text x="1510" y="51" class="oversight-text">Interprets patterns and counterevidence</text>
    <text x="1510" y="84" class="oversight-text">• authorizes final claims and limitations</text>
  </g>

  <text x="1300" y="1188" text-anchor="middle" class="note">LLM-assisted agents support extraction and comparison; substantive interpretation remains the researcher’s responsibility.</text>
  <line x1="80" y1="1225" x2="2520" y2="1225" stroke="#B8B8B8" stroke-width="1.5"/>
</svg>
