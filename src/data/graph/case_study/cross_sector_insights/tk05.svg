<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1480" viewBox="0 0 2000 1480" role="img"
     aria-labelledby="title desc">
  <title id="title">TK05 evidence pathways from aggregate tacit knowledge to industries and cases</title>
  <desc id="desc">A three-level evidence hierarchy. Central TK05 branches to s001 Construction, s002 Manufacturing, and s003 Health Services, then to fourteen case nodes. Every industry and case node identifies tacit knowledge TK05 and its convergence or divergence technology-enabled practices.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 54px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .subtitle { font: 400 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d4d4d; }
      .stage { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.7px; fill: #666666; }
      .node-title { font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .node-subtitle { font: 600 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333333; }
      .body { font: 400 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333333; }
      .small { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d4d4d; }
      .case-id { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .case-name { font: 500 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333333; }
      .tk-text { font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .conv-text { font: 700 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d4d4d; }
      .div-text { font: 700 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7f7f7f; }
      .edge { fill: none; stroke: #666666; stroke-width: 3; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #999999; stroke-width: 2; }
      .case-card { fill: #ffffff; stroke: #bfbfbf; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="2000" height="1600" fill="#f5f5f5"/>

  <text x="70" y="62" class="title">TK05 Evidence Pathways</text>
  <text x="70" y="96" class="subtitle">Aggregate tacit-knowledge target → sector-coded instance → case-level technology-enabled practice evidence</text>

  <!-- Legend -->
  <g transform="translate(70,126)">
    <rect x="0" y="0" width="1760" height="70" rx="14" fill="#ffffff" stroke="#d9d9d9"/>
    <circle cx="30" cy="24" r="9" fill="#111111"/>
    <text x="48" y="29" class="body"><tspan font-weight="700">TK</tspan> Tacit knowledge</text>
    <circle cx="252" cy="24" r="9" fill="#4d4d4d"/>
    <text x="270" y="29" class="body"><tspan font-weight="700">TP–C</tspan> Convergence pathway: recurrent across sectors</text>
    <circle cx="690" cy="24" r="9" fill="#7f7f7f"/>
    <text x="708" y="29" class="body"><tspan font-weight="700">TP–D</tspan> Divergence pathway: sector-specific</text>
    <text x="30" y="55" class="small">C: TP03 XR · TP09 semantic retrieval · TP10 archiving · TP12 multimedia/blended</text>
    <text x="870" y="55" class="small">D: TP01 models · TP04 feedback · TP06 sensors · TP07 algorithms · TP13 evaluation · TP16 scenarios</text>
  </g>

  <text x="72" y="230" class="stage">CENTER / AGGREGATE</text>
  <text x="430" y="230" class="stage">INDUSTRY-LEVEL TK INSTANCE</text>
  <text x="870" y="230" class="stage">CASE-LEVEL EVIDENCE: TK + TECHNOLOGY-ENABLED PRACTICE</text>

