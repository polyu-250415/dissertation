<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Evidence chain for the TP03–TK06 cross-sector convergence pattern</title>
  <desc id="desc">A three-level knowledge-graph diagram linking the hard-aggregation TP03 and TK06 nodes to paired sector nodes in construction, services, and manufacturing, and then to representative case-level practice and tacit-knowledge evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .level { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.5px; fill: #64748B; }
      .sector { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .node-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .node-id { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .body { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .rel { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .badge { font: 800 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: white; }
      .tp { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .tk { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .case { fill: white; stroke: #CBD5E1; stroke-width: 1.5; }
      .sector-box { fill: rgba(255,255,255,0.72); stroke: #CBD5E1; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748B; stroke-width: 2; }
      .inst { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <text x="60" y="52" class="title">XR-Situated Perceptual Recognition Convergence</text>
  <text x="60" y="80" class="subtitle">Evidence chain for &lt;TP03, TK06&gt; • Hard aggregation → three sector pairs → representative case evidence</text>

  <g transform="translate(1360,40)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#2563EB"/>
    <text x="28" y="16" text-anchor="middle" class="badge">TP</text>
    <text x="66" y="17" class="small">Technology-enabled practice</text>
    <rect x="0" y="34" width="56" height="24" rx="12" fill="#EA580C"/>
    <text x="28" y="50" text-anchor="middle" class="badge">TK</text>
    <text x="66" y="51" class="small">Tacit knowledge</text>
  </g>

  <text x="60" y="126" class="level">CROSS-SECTOR CENTER</text>
  <g filter="url(#shadow)">
    <rect x="245" y="145" width="570" height="104" rx="16" class="tp"/>
    <rect x="265" y="163" width="46" height="24" rx="12" fill="#2563EB"/>
    <text x="288" y="179" text-anchor="middle" class="badge">TP</text>
    <text x="327" y="180" class="node-id">h001M01TP03</text>
    <text x="265" y="211" class="node-title">Situated Experiential Learning through XR Set</text>
    <text x="265" y="234" class="small">53 aggregated practice statements</text>

    <rect x="985" y="145" width="570" height="104" rx="16" class="tk"/>
    <rect x="1005" y="163" width="46" height="24" rx="12" fill="#EA580C"/>
    <text x="1028" y="179" text-anchor="middle" class="badge">TK</text>
    <text x="1067" y="180" class="node-id">h001M01TK06</text>
    <text x="1005" y="211" class="node-title">Trained Sensory and Perceptual Recognition Set</text>
    <text x="1005" y="234" class="small">38 aggregated tacit-knowledge statements</text>
  </g>
  <path d="M985 183 H815" class="connector" marker-end="url(#arrow)"/>
  <text x="900" y="174" text-anchor="middle" class="rel">TK be_transferred_by TP</text>
  <path d="M815 222 H985" class="connector" marker-end="url(#arrow)"/>
  <text x="900" y="242" text-anchor="middle" class="rel">TP evaluate TK</text>

  <path d="M900 265 V295 H320 V320" class="inst"/>
  <path d="M900 265 V320" class="inst"/>
  <path d="M900 265 V295 H1480 V320" class="inst"/>
  <text x="918" y="286" class="small">is_an_instance_of</text>

  <text x="60" y="319" class="level">SECTOR-LEVEL PAIRS</text>

  <!-- Sector 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="335" width="560" height="305" rx="18" class="sector-box"/>
    <text x="65" y="370" class="sector">Sector 1 · Construction</text>
    <text x="65" y="392" class="small">SIC 15</text>
    <rect x="65" y="414" width="510" height="72" rx="12" class="tp"/>
    <rect x="82" y="428" width="40" height="22" rx="11" fill="#2563EB"/>
    <text x="102" y="443" text-anchor="middle" class="badge">TP</text>
    <text x="135" y="444" class="node-id">s001M01TP03</text>
    <text x="82" y="469" class="body">Situated experiential learning through XR</text>
    <rect x="65" y="536" width="510" height="72" rx="12" class="tk"/>
    <rect x="82" y="550" width="40" height="22" rx="11" fill="#EA580C"/>
    <text x="102" y="565" text-anchor="middle" class="badge">TK</text>
    <text x="135" y="566" class="node-id">s001M01TK06</text>
    <text x="82" y="591" class="body">Hazard and spatial-perceptual recognition</text>
  </g>
  <path d="M320 536 V486" class="connector" marker-end="url(#arrow)"/>
  <rect x="211" y="498" width="218" height="26" rx="13" fill="#F1F5F9"/>
  <text x="320" y="515" text-anchor="middle" class="rel">be_transferred_by · n=3</text>

  <!-- Sector 2 -->
  <g filter="url(#shadow)">
    <rect x="620" y="335" width="560" height="305" rx="18" class="sector-box"/>
    <text x="645" y="370" class="sector">Sector 2 · Services (Health Services)</text>
    <text x="645" y="392" class="small">SIC 80 · evidence content is predominantly industrial training</text>
    <rect x="645" y="414" width="510" height="72" rx="12" class="tp"/>
    <rect x="662" y="428" width="40" height="22" rx="11" fill="#2563EB"/>
    <text x="682" y="443" text-anchor="middle" class="badge">TP</text>
    <text x="715" y="444" class="node-id">s002M01TP03</text>
    <text x="662" y="469" class="body">Situated experiential learning through XR</text>
    <rect x="645" y="536" width="510" height="72" rx="12" class="tk"/>
    <rect x="662" y="550" width="40" height="22" rx="11" fill="#EA580C"/>
    <text x="682" y="565" text-anchor="middle" class="badge">TK</text>
    <text x="715" y="566" class="node-id">s002M01TK06</text>
    <text x="662" y="591" class="body">Error, component, and sequence recognition</text>
  </g>
  <path d="M900 536 V486" class="connector" marker-end="url(#arrow)"/>
  <rect x="773" y="498" width="254" height="26" rx="13" fill="#F1F5F9"/>
  <text x="900" y="515" text-anchor="middle" class="rel">be_captured_by · n=2 / evaluate · n=1</text>

  <!-- Sector 3 -->
  <g filter="url(#shadow)">
    <rect x="1200" y="335" width="560" height="305" rx="18" class="sector-box"/>
    <text x="1225" y="370" class="sector">Sector 3 · Manufacturing</text>
    <text x="1225" y="392" class="small">SIC 20–39 · evidence content includes clinical and emergency training</text>
    <rect x="1225" y="414" width="510" height="72" rx="12" class="tp"/>
    <rect x="1242" y="428" width="40" height="22" rx="11" fill="#2563EB"/>
    <text x="1262" y="443" text-anchor="middle" class="badge">TP</text>
    <text x="1295" y="444" class="node-id">s003M01TP03</text>
    <text x="1242" y="469" class="body">Situated experiential learning through XR</text>
    <rect x="1225" y="536" width="510" height="72" rx="12" class="tk"/>
    <rect x="1242" y="550" width="40" height="22" rx="11" fill="#EA580C"/>
    <text x="1262" y="565" text-anchor="middle" class="badge">TK</text>
    <text x="1295" y="566" class="node-id">s003M01TK06</text>
    <text x="1242" y="591" class="body">Risk, spatial, and situational recognition</text>
  </g>
  <path d="M1480 536 V486" class="connector" marker-end="url(#arrow)"/>
  <rect x="1349" y="498" width="262" height="26" rx="13" fill="#F1F5F9"/>
  <text x="1480" y="515" text-anchor="middle" class="rel">be_transferred_by · n=3 / captured · n=2</text>

  <path d="M320 640 V678" class="inst"/>
  <path d="M900 640 V678" class="inst"/>
  <path d="M1480 640 V678" class="inst"/>
  <text x="60" y="684" class="level">REPRESENTATIVE CASE-LEVEL EVIDENCE</text>

  <!-- Case evidence column 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="704" width="560" height="418" rx="18" class="sector-box"/>
    <rect x="65" y="730" width="510" height="160" rx="14" class="case"/>
    <rect x="82" y="749" width="476" height="48" rx="10" class="tp"/>
    <text x="98" y="770" class="node-id">TP · c002M02N24 / c002M02N25</text>
    <text x="98" y="789" class="small">Immersive VR simulation / interactive AR overlay</text>
    <path d="M320 800 V824" class="connector" marker-end="url(#arrow)"/>
    <text x="337" y="817" class="rel">transfer</text>
    <rect x="82" y="828" width="476" height="45" rx="10" class="tk"/>
    <text x="98" y="849" class="node-id">TK · c002M02N07</text>
    <text x="98" y="868" class="small">On-site hazard-identification competency</text>

    <rect x="65" y="912" width="510" height="160" rx="14" class="case"/>
    <rect x="82" y="931" width="476" height="48" rx="10" class="tp"/>
    <text x="98" y="952" class="node-id">TP · c005M02N26</text>
    <text x="98" y="971" class="small">VR bridge-construction safety model + haptic cue</text>
    <path d="M320 982 V1006" class="connector" marker-end="url(#arrow)"/>
    <text x="337" y="999" class="rel">transfer</text>
    <rect x="82" y="1010" width="476" height="45" rx="10" class="tk"/>
    <text x="98" y="1031" class="node-id">TK · c005M01N08</text>
    <text x="98" y="1050" class="small">Hazard-identification skill improved post-training</text>
  </g>

  <!-- Case evidence column 2 -->
  <g filter="url(#shadow)">
    <rect x="620" y="704" width="560" height="418" rx="18" class="sector-box"/>
    <rect x="645" y="730" width="510" height="160" rx="14" class="case"/>
    <rect x="662" y="749" width="476" height="48" rx="10" class="tp"/>
    <text x="678" y="770" class="node-id">TP · c106M01N15</text>
    <text x="678" y="789" class="small">VMAR machinery-setup training module</text>
    <path d="M900 800 V824" class="connector" marker-end="url(#arrow)"/>
    <text x="917" y="817" class="rel">capture / evaluate</text>
    <rect x="662" y="828" width="476" height="45" rx="10" class="tk"/>
    <text x="678" y="849" class="node-id">TK · c106M01N09</text>
    <text x="678" y="868" class="small">Recognition and correction of setup errors</text>

    <rect x="645" y="912" width="510" height="160" rx="14" class="case"/>
    <rect x="662" y="931" width="476" height="48" rx="10" class="tp"/>
    <text x="678" y="952" class="node-id">TP · c107M02N21</text>
    <text x="678" y="971" class="small">A.R.P.S. pneumatic-system AR simulation</text>
    <path d="M900 982 V1006" class="connector" marker-end="url(#arrow)"/>
    <text x="917" y="999" class="rel">capture</text>
    <rect x="662" y="1010" width="476" height="45" rx="10" class="tk"/>
    <text x="678" y="1031" class="node-id">TK · c107M01N06</text>
    <text x="678" y="1050" class="small">Component and functional-sequence recognition</text>
  </g>

  <!-- Case evidence column 3 -->
  <g filter="url(#shadow)">
    <rect x="1200" y="704" width="560" height="418" rx="18" class="sector-box"/>
    <rect x="1225" y="730" width="510" height="160" rx="14" class="case"/>
    <rect x="1242" y="749" width="476" height="48" rx="10" class="tp"/>
    <text x="1258" y="770" class="node-id">TP · c214M02N26</text>
    <text x="1258" y="789" class="small">Adaptive AI-powered VR nuclear-safety training</text>
    <path d="M1480 800 V824" class="connector" marker-end="url(#arrow)"/>
    <text x="1497" y="817" class="rel">transfer</text>
    <rect x="1242" y="828" width="476" height="45" rx="10" class="tk"/>
    <text x="1258" y="849" class="node-id">TK · c214M02N08</text>
    <text x="1258" y="868" class="small">Risk identification in nuclear-hazard scenarios</text>

    <rect x="1225" y="912" width="510" height="160" rx="14" class="case"/>
    <rect x="1242" y="931" width="476" height="48" rx="10" class="tp"/>
    <text x="1258" y="952" class="node-id">TP · c216M01N35</text>
    <text x="1258" y="971" class="small">ReviveXR mixed-reality overdose-response training</text>
    <path d="M1480 982 V1006" class="connector" marker-end="url(#arrow)"/>
    <text x="1497" y="999" class="rel">transfer / capture</text>
    <rect x="1242" y="1010" width="476" height="45" rx="10" class="tk"/>
    <text x="1258" y="1031" class="node-id">TK · c216M01N10 / c216M02N18</text>
    <text x="1258" y="1050" class="small">Breathing check / MR situational awareness</text>
  </g>

  <rect x="60" y="1154" width="1680" height="70" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="86" y="1182" style="font:700 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#065F46">ASSESSMENT · QUALIFIED VALIDATION</text>
  <text x="86" y="1207" class="body">All three sector-level TP03–TK06 pairs have direct evidence; confidence is moderated by uneven hard-level aggregation and sector-label/content mismatch.</text>
  <text x="1740" y="1245" text-anchor="end" class="small">Dashed arrows = aggregation/instance links · c* entries are evidence identifiers embedded in sector nodes</text>
</svg>
