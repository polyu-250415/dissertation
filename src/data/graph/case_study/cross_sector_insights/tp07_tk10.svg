<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Evidence chain for the TP07–TK10 context-bounded convergence pattern</title>
  <desc id="desc">A three-level knowledge-graph diagram linking aggregate TP07 and TK10 nodes to supported sector pairs in s001 and s003, and then to case-level evidence. A boundary assessment records that s002 contains both categories but no relationship between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .level { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.5px; fill: #64748B; }
      .sector { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .node-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0F172A; }
      .node-id { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .body { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .rel { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .badge { font: 800 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: white; }
      .tp { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; }
      .tk { fill: #FFF7ED; stroke: #EA580C; stroke-width: 2; }
      .case { fill: white; stroke: #CBD5E1; stroke-width: 1.5; }
      .sector-box { fill: rgba(255,255,255,0.72); stroke: #CBD5E1; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748B; stroke-width: 2; }
      .inst { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="url(#bg)"/>
  <text x="60" y="52" class="title">Algorithmic Professional-Judgment Convergence</text>
  <text x="60" y="80" class="subtitle">Evidence chain for &lt;TP07, TK10&gt; • Hard aggregation → two supported sector pairs → case-level evidence</text>

  <g transform="translate(1360,40)">
    <rect x="0" y="0" width="56" height="24" rx="12" fill="#2563EB"/>
    <text x="28" y="16" text-anchor="middle" class="badge">TP</text>
    <text x="66" y="17" class="small">Technology-enabled practice</text>
    <rect x="0" y="34" width="56" height="24" rx="12" fill="#EA580C"/>
    <text x="28" y="50" text-anchor="middle" class="badge">TK</text>
    <text x="66" y="51" class="small">Tacit knowledge</text>
  </g>

  <text x="60" y="126" class="level">CROSS-SECTOR CENTER</text>
  <g filter="url(#shadow)">
    <rect x="245" y="145" width="570" height="104" rx="16" class="tp"/>
    <rect x="265" y="163" width="46" height="24" rx="12" fill="#2563EB"/>
    <text x="288" y="179" text-anchor="middle" class="badge">TP</text>
    <text x="327" y="180" class="node-id">h001M01TP07</text>
    <text x="265" y="211" class="node-title">Algorithmic Pattern Discovery and Prediction Set</text>
    <text x="265" y="234" class="small">82 aggregated practice statements</text>

    <rect x="985" y="145" width="570" height="104" rx="16" class="tk"/>
    <rect x="1005" y="163" width="46" height="24" rx="12" fill="#EA580C"/>
    <text x="1028" y="179" text-anchor="middle" class="badge">TK</text>
    <text x="1067" y="180" class="node-id">h001M01TK10</text>
    <text x="1005" y="211" class="node-title">Shared Professional Norms and Standards of Judgment Set</text>
    <text x="1005" y="234" class="small">50 aggregated tacit-knowledge statements</text>
  </g>
  <path d="M985 183 H815" class="connector" marker-end="url(#arrow)"/>
  <rect x="820" y="153" width="160" height="26" rx="13" fill="#F1F5F9"/>
  <text x="900" y="170" text-anchor="middle" class="rel">be_captured_by · n=7</text>
  <text x="900" y="270" text-anchor="middle" class="small">Hard-level edge is sourced from s001; the s003 transfer link is retained below.</text>

  <path d="M900 285 V305 H450 V330" class="inst"/>
  <path d="M900 285 V305 H1350 V330" class="inst"/>
  <text x="918" y="304" class="small">is_an_instance_of</text>

  <text x="60" y="329" class="level">SECTOR-LEVEL PAIRS</text>

  <g filter="url(#shadow)">
    <rect x="40" y="345" width="840" height="320" rx="18" class="sector-box"/>
    <text x="65" y="380" class="sector">Sector s001 · Construction</text>
    <text x="65" y="402" class="small">SIC 15 · direct TP07–TK10 pair observed</text>
    <rect x="65" y="424" width="790" height="72" rx="12" class="tp"/>
    <rect x="82" y="438" width="40" height="22" rx="11" fill="#2563EB"/>
    <text x="102" y="453" text-anchor="middle" class="badge">TP</text>
    <text x="135" y="454" class="node-id">s001M01TP07</text>
    <text x="82" y="479" class="body">Algorithmic pattern discovery and prediction · 16 node statements</text>
    <rect x="65" y="545" width="790" height="72" rx="12" class="tk"/>
    <rect x="82" y="559" width="40" height="22" rx="11" fill="#EA580C"/>
    <text x="102" y="574" text-anchor="middle" class="badge">TK</text>
    <text x="135" y="575" class="node-id">s001M01TK10</text>
    <text x="82" y="600" class="body">Shared professional safety norms and standards of judgment · 28 node statements</text>
  </g>
  <path d="M450 545 V496" class="connector" marker-end="url(#arrow)"/>
  <rect x="341" y="508" width="218" height="26" rx="13" fill="#F1F5F9"/>
  <text x="450" y="525" text-anchor="middle" class="rel">be_captured_by · n=7</text>
  <text x="450" y="646" text-anchor="middle" class="small">Primary mechanism: Digital Codification</text>

  <g filter="url(#shadow)">
    <rect x="920" y="345" width="840" height="320" rx="18" class="sector-box"/>
    <text x="945" y="380" class="sector">Sector s003 · Manufacturing in Neo4j metadata</text>
    <text x="945" y="402" class="small">SIC 20–39 · evidence case concerns adaptive safety training</text>
    <rect x="945" y="424" width="790" height="72" rx="12" class="tp"/>
    <rect x="962" y="438" width="40" height="22" rx="11" fill="#2563EB"/>
    <text x="982" y="453" text-anchor="middle" class="badge">TP</text>
    <text x="1015" y="454" class="node-id">s003M01TP07</text>
    <text x="962" y="479" class="body">Algorithmic pattern discovery and prediction · 19 node statements</text>
    <rect x="945" y="545" width="790" height="72" rx="12" class="tk"/>
    <rect x="962" y="559" width="40" height="22" rx="11" fill="#EA580C"/>
    <text x="982" y="574" text-anchor="middle" class="badge">TK</text>
    <text x="1015" y="575" class="node-id">s003M01TK10</text>
    <text x="962" y="600" class="body">Shared professional norms and standards of judgment · 18 node statements</text>
  </g>
  <path d="M1350 545 V496" class="connector" marker-end="url(#arrow)"/>
  <rect x="1234" y="508" width="232" height="26" rx="13" fill="#F1F5F9"/>
  <text x="1350" y="525" text-anchor="middle" class="rel">be_transferred_by · n=1</text>
  <text x="1350" y="646" text-anchor="middle" class="small">Secondary pathway: adaptive diagnosis + experiential reinforcement</text>

  <path d="M450 665 V704" class="inst"/>
  <path d="M1350 665 V704" class="inst"/>
  <text x="60" y="710" class="level">CASE-LEVEL EVIDENCE</text>

  <g filter="url(#shadow)">
    <rect x="40" y="730" width="840" height="400" rx="18" class="sector-box"/>
    <text x="65" y="760" class="sector">c008 · Construction-accident text classification</text>
    <rect x="65" y="778" width="790" height="106" rx="14" class="case"/>
    <rect x="82" y="790" width="756" height="36" rx="10" class="tp"/>
    <text x="98" y="813" class="node-id">TP · c008M01N23 · Accident-text classification framework</text>
    <path d="M450 849 V826" class="connector" marker-end="url(#arrow)"/>
    <text x="469" y="844" class="rel">capture · n=2</text>
    <rect x="82" y="849" width="756" height="25" rx="10" class="tk"/>
    <text x="98" y="867" class="small">TK · c008M01N09 / c008M01N10 · risk-factor importance and scenario-specific hazards</text>
    <rect x="65" y="894" width="790" height="106" rx="14" class="case"/>
    <rect x="82" y="906" width="756" height="36" rx="10" class="tp"/>
    <text x="98" y="929" class="node-id">TP · c008M01N25 · Phrase extraction</text>
    <path d="M450 965 V942" class="connector" marker-end="url(#arrow)"/>
    <text x="469" y="960" class="rel">capture · n=3</text>
    <rect x="82" y="965" width="756" height="25" rx="10" class="tk"/>
    <text x="98" y="983" class="small">TK · c008M01N11 / N12 / N13 · temporary support, soil stability, and material-fatigue judgment</text>
    <rect x="65" y="1010" width="790" height="106" rx="14" class="case"/>
    <rect x="82" y="1022" width="756" height="36" rx="10" class="tp"/>
    <text x="98" y="1045" class="node-id">TP · c008M01N27 · CNN text classification</text>
    <path d="M450 1081 V1058" class="connector" marker-end="url(#arrow)"/>
    <text x="469" y="1076" class="rel">capture · n=2</text>
    <rect x="82" y="1081" width="756" height="25" rx="10" class="tk"/>
    <text x="98" y="1099" class="small">TK · c008M01N09 / c008M01N10 · learned latent importance and potential safety hazards</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="730" width="840" height="400" rx="18" class="sector-box"/>
    <text x="945" y="760" class="sector">c214 · Adaptive VR–LLM safety training</text>
    <rect x="945" y="778" width="790" height="178" rx="14" class="case"/>
    <rect x="962" y="798" width="756" height="48" rx="10" class="tp"/>
    <text x="978" y="819" class="node-id">TP · c214M01N20</text>
    <text x="978" y="838" class="small">Adaptive learning system identifies weaknesses and initiates targeted retraining</text>
    <path d="M1350 882 V846" class="connector" marker-end="url(#arrow)"/>
    <text x="1368" y="873" class="rel">transfer · n=1</text>
    <rect x="962" y="882" width="756" height="54" rx="10" class="tk"/>
    <text x="978" y="903" class="node-id">TK · c214M01N11</text>
    <text x="978" y="922" class="small">Selection of appropriate preventive or recovery responses in hazardous situations</text>
    <rect x="945" y="980" width="790" height="118" rx="14" class="case"/>
    <text x="968" y="1008" class="node-title">Interpretive boundary</text>
    <text x="968" y="1035" class="body">The algorithm diagnoses performance patterns; situated retraining carries the transfer.</text>
    <text x="968" y="1060" class="body">The evidence supports immediate reinforcement, not demonstrated long-term retention.</text>
    <text x="968" y="1085" class="small">One relationship statement from one case; confidence is therefore lower than for s001.</text>
  </g>

  <rect x="60" y="1154" width="1680" height="70" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="86" y="1182" style="font:700 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#065F46">ASSESSMENT · CONTEXT-BOUNDED VALIDATION</text>
  <text x="86" y="1207" class="body">Direct TP07–TK10 links occur in s001 and s003; s002 contains both categories but no pair edge. The pattern is bounded rather than cross-sector universal.</text>
  <text x="1740" y="1245" text-anchor="end" class="small">Dashed arrows = aggregation/instance links · c* entries are evidence identifiers embedded in sector nodes</text>
</svg>
