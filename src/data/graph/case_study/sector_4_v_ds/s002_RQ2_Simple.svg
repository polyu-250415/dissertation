    <text x="838" y="955" class="dep-code" fill="var(--p3)">P3 · #3</text><text x="1144" y="955" text-anchor="end" class="score">17</text>
    <text x="838" y="987" class="dep-title">Maintained machinery, CAD models,</text>
    <text x="838" y="1010" class="dep-title">historical production records and</text>
    <text x="838" y="1033" class="dep-title">learning-factory facilities</text>
    <text x="838" y="1067" class="dep-note">equipment · models · data · facilities</text>
    <text x="838" y="1102" class="dep-ids">Primary ID: OD03</text>

    <rect x="1194" y="925" width="350" height="205" rx="13" class="card" stroke="var(--p4)"/>
    <text x="1216" y="955" class="dep-code" fill="var(--p4)">P4 · #4</text><text x="1522" y="955" text-anchor="end" class="score">11</text>
    <text x="1216" y="987" class="dep-title">Factory-floor and training-space</text>
    <text x="1216" y="1010" class="dep-title">conditions for situated</text>
    <text x="1216" y="1033" class="dep-title">industrial learning</text>
    <text x="1216" y="1067" class="dep-note">layout · heat · dust · noise · utilities</text>
    <text x="1216" y="1102" class="dep-ids">Primary ID: ED08</text>

    <rect x="1572" y="925" width="350" height="205" rx="13" class="card" stroke="var(--p5)"/>
    <text x="1594" y="955" class="dep-code" fill="var(--p5)">P5 · #5</text><text x="1900" y="955" text-anchor="end" class="score">8</text>
    <text x="1594" y="987" class="dep-title">Machinery-safety, data-protection</text>
    <text x="1594" y="1010" class="dep-title">and emerging-technology</text>
