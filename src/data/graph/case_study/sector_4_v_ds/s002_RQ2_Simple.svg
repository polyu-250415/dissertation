    <text x="82" y="955" class="dep-code" fill="var(--p1)">P1 · #1</text><text x="388" y="955" text-anchor="end" class="score">52</text>
    <text x="82" y="987" class="dep-title">Formal maintenance-knowledge</text>
    <text x="82" y="1010" class="dep-title">handover and expert-elicitation</text>
    <text x="82" y="1033" class="dep-title">routines</text>
    <text x="82" y="1067" class="dep-note">handover · elicitation · verification</text>
    <text x="82" y="1102" class="dep-ids">Primary ID: LI10</text>

    <rect x="438" y="925" width="350" height="205" rx="13" class="card" stroke="var(--p2)"/>
    <text x="460" y="955" class="dep-code" fill="var(--p2)">P2 · #2</text><text x="766" y="955" text-anchor="end" class="score">18</text>
    <text x="460" y="987" class="dep-title">Skilled operator, trainer and</text>
    <text x="460" y="1010" class="dep-title">cross-functional participation in</text>
    <text x="460" y="1033" class="dep-title">factory learning and validation</text>
    <text x="460" y="1067" class="dep-note">expert input · feedback · coordination</text>
    <text x="460" y="1102" class="dep-ids">Primary ID: OD05</text>

