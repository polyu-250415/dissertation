    <text x="102" y="178" class="dep-code" fill="var(--d1)">D1 · #1</text>
    <text x="102" y="203" class="dep-title">Clinical data, algorithm &amp; validation assurance</text>
    <text x="102" y="226" class="dep-ids">IDs: LI05 · LI13 · LI14</text>
    <text x="535" y="178" text-anchor="end" class="score">66</text>
  </g>

