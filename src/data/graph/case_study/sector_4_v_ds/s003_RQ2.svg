    <text x="682" y="203" class="dep-title">Adaptive clinical learning &amp; user-safety design</text>
    <text x="682" y="226" class="dep-ids">IDs: LI01 · LI02 · LI03 · LI04</text>
    <text x="1115" y="178" text-anchor="end" class="score">65</text>
  </g>

