  <g class="relation-set" aria-label="D3 connected device, site and source infrastructure relationships">
    <path class="link d3 solid" d="M1480 240 C1480 350 900 535 900 635"/>
    <path class="link d3 both" d="M1480 240 C1480 295 480 325 480 390"/>
    <path class="link d3 solid" d="M1480 240 C1480 320 735 405 735 495"/>
    <path class="link d3 solid" d="M1480 240 C1480 320 945 405 945 495"/>
    <path class="link d3 both" d="M1480 240 C1480 295 660 325 660 390"/>
