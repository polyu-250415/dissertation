<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title desc">
  <title id="title">Dependency-to-practice index relationships for emerging-technology-enabled tacit knowledge retention</title>
  <desc id="desc">A three-layer relationship map for the bounded s003 healthcare sample. Three digitally reconfigured dependency blocks connect to technology-enabled practices grouped by digital codification or experiential amplification and to traditional human-centred practice indexes. Four persistently established dependency blocks condition the same practices. Each dependency block lists its constituent graph IDs.</desc>

  <defs>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --ink: #172033;
        --muted: #596579;
        --line: #aab5c4;
        --top-band: #eaf2ff;
        --middle-band: #edf8f4;
        --bottom-band: #fff3e8;
        --node: #ffffff;
        --node-stroke: #718096;
        --tech-fill: #eef6ff;
        --exp-fill: #f5efff;
        --trad-fill: #fff7e8;
        --codify: #2d6fb7;
        --experience: #7657b5;
        --d1: #225ea8;
        --d2: #15927f;
        --d3: #7154b3;
        --p1: #bc5b18;
        --p2: #b53d5a;
        --p3: #8b6b00;
        --p4: #8a4d2f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --ink: #f3f4f6;
          --muted: #c6ceda;
          --line: #667085;
          --top-band: #172b49;
          --middle-band: #17362d;
          --bottom-band: #422a1b;
          --node: #1f2937;
          --node-stroke: #94a3b8;
          --tech-fill: #1d3554;
          --exp-fill: #352b52;
          --trad-fill: #49351f;
          --codify: #80bfff;
          --experience: #c4afff;
          --d1: #80bfff;
          --d2: #71dcc7;
          --d3: #bea6ff;
          --p1: #ffb26f;
          --p2: #ff94aa;
          --p3: #e9c95c;
          --p4: #e8a27f;
        }
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .figure-title { font-size: 31px; font-weight: 500; letter-spacing: -0.25px; }
      .subtitle { font-size: 16px; fill: var(--muted); }
      .section-title { font-size: 22px; font-weight: 500; }
      .section-note { font-size: 14px; fill: var(--muted); }
      .dep-code { font-size: 15px; font-weight: 500; }
      .dep-title { font-size: 18px; font-weight: 500; }
      .dep-ids { font-size: 13px; fill: var(--muted); }
      .score { font-size: 14px; fill: var(--muted); }
      .row-label { font-size: 14px; font-weight: 500; letter-spacing: 0.5px; }
      .mechanism-title { font-size: 16px; font-weight: 500; }
      .mechanism-note { font-size: 13px; fill: var(--muted); }
      .practice-id { font-size: 14px; font-weight: 500; text-anchor: middle; }
      .legend { font-size: 13px; fill: var(--muted); }
      .top-card, .bottom-card { fill: var(--node); stroke-width: 2; }
      .mechanism-frame { fill: var(--node); fill-opacity: 0.55; stroke-width: 1.5; }
      .codification-frame { stroke: var(--codify); }
      .experience-frame { stroke: var(--experience); }
      .practice-code { fill: var(--tech-fill); stroke: var(--codify); stroke-width: 1.2; }
      .practice-exp { fill: var(--exp-fill); stroke: var(--experience); stroke-width: 1.2; }
      .practice-trad { fill: var(--trad-fill); stroke: var(--node-stroke); stroke-width: 1.2; }
      .link { fill: none; stroke-width: 1.7; opacity: 0.25; }
      .relation-set:hover .link { opacity: 0.88; stroke-width: 2.5; }
      .relation-set:hover .top-card, .relation-set:hover .bottom-card { stroke-width: 3; }
      .solid { stroke-dasharray: none; }
      .both { stroke-dasharray: 9 4 2 4; }
      .mitigate { stroke-dasharray: 7 6; }
      .d1 { stroke: var(--d1); }
      .d2 { stroke: var(--d2); }
      .d3 { stroke: var(--d3); }
      .p1 { stroke: var(--p1); }
      .p2 { stroke: var(--p2); }
      .p3 { stroke: var(--p3); }
      .p4 { stroke: var(--p4); }
    </style>
  </defs>

  <rect width="1800" height="1150" fill="var(--bg)"/>
  <text x="55" y="50" class="figure-title">Resource and Capability Dependencies for Health Services</text>

  <rect x="35" y="100" width="1730" height="175" rx="18" fill="var(--top-band)"/>
  <text x="65" y="132" class="section-title">Digitally reconfigured dependencies</text>
  <text x="1735" y="132" text-anchor="end" class="section-note">dependency IDs omit the shared prefix s003M01</text>

  <rect x="35" y="310" width="1730" height="490" rx="18" fill="var(--middle-band)"/>
  <text x="65" y="355" class="section-title">TECHNOLOGY-ENABLED PRACTICE INDEXES</text>
  <text x="1735" y="345" text-anchor="end" class="section-note">TP = technology-enabled · THR = traditional human-centred</text>

  <rect x="35" y="835" width="1730" height="245" rx="18" fill="var(--bottom-band)"/>
  <text x="65" y="870" class="section-title">Persistently established dependencies</text>
  <text x="1735" y="870" text-anchor="end" class="section-note">dependency IDs omit the shared prefix s003M01</text>

