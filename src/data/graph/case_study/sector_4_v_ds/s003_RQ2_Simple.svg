<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1310" viewBox="0 0 2000 1310" role="img" aria-labelledby="title desc">
  <title id="title">Resources and capabilities required for emerging-technology-enabled tacit knowledge retention in healthcare</title>
  <desc id="desc">Conceptual map for the bounded s003 healthcare cases. Five dependencies reshaped by digital clinical practice and five persistently established healthcare dependencies jointly condition digital codification and experiential amplification. Practice indexes and case evidence appear in the central panels. Culture, leadership-adoption and sociocultural dependencies are excluded.</desc>

  <defs>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff; --ink: #111111; --muted: #5f6368;
        --band-stroke: #b8b8b8;
        --node: #ffffff;
        --tech-fill: #f7f7f7; --exp-fill: #fbfbfb;
        --codify: #292929; --experience: #595959;
        --d1: #1f1f1f; --d2: #383838; --d3: #515151; --d4: #6a6a6a; --d5: #838383;
        --p1: #2b2b2b; --p2: #444444; --p3: #5d5d5d; --p4: #767676; --p5: #8f8f8f;
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .figure-title { font-size: 31px; font-weight: 500; letter-spacing: -0.25px; }
      .subtitle { font-size: 16px; fill: var(--muted); }
      .section-title { font-size: 22px; font-weight: 500; }
      .section-note { font-size: 14px; fill: var(--muted); }
      .dep-code { font-size: 15px; font-weight: 600; }
      .dep-title { font-size: 15.5px; font-weight: 500; }
      .dep-note { font-size: 12.5px; fill: var(--muted); }
      .dep-ids { font-size: 13px; fill: var(--muted); }
      .score { font-size: 14px; fill: var(--muted); }
      .mechanism-title { font-size: 20px; font-weight: 600; }
      .mechanism-note { font-size: 15px; fill: var(--muted); }
      .mechanism-item { font-size: 15px; }
      .evidence-line { font-size: 12.2px; fill: var(--muted); letter-spacing: 0.02px; }
      .legend { font-size: 13px; fill: var(--muted); }
      .card { fill: var(--node); stroke-width: 2; }
      .mechanism-frame { stroke-width: 1.7; }
      .codification-frame { fill: var(--tech-fill); stroke: var(--codify); }
      .experience-frame { fill: var(--exp-fill); stroke: var(--experience); }
      .link { fill: none; stroke-width: 2; opacity: 0.28; }
      .link-digital { stroke-dasharray: 9 5; }
      .link-persistent { stroke-dasharray: none; }
      .d1 { stroke: var(--d1); } .d2 { stroke: var(--d2); } .d3 { stroke: var(--d3); }
      .d4 { stroke: var(--d4); } .d5 { stroke: var(--d5); }
      .p1 { stroke: var(--p1); } .p2 { stroke: var(--p2); } .p3 { stroke: var(--p3); }
      .p4 { stroke: var(--p4); } .p5 { stroke: var(--p5); }
      .relation-set:hover .link { opacity: 0.9; stroke-width: 3; }
      .relation-set:hover .card { stroke-width: 3; }
    </style>

    <marker id="arrow-d1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--d1)"/></marker>
    <marker id="arrow-d2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--d2)"/></marker>
    <marker id="arrow-d3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--d3)"/></marker>
    <marker id="arrow-d4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--d4)"/></marker>
    <marker id="arrow-d5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--d5)"/></marker>
    <marker id="arrow-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--p1)"/></marker>
    <marker id="arrow-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--p2)"/></marker>
    <marker id="arrow-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--p3)"/></marker>
    <marker id="arrow-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--p4)"/></marker>
    <marker id="arrow-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="var(--p5)"/></marker>
  </defs>

  <rect width="2000" height="1310" fill="var(--bg)"/>
  <text x="55" y="47" class="figure-title">Resource and Capability Dependencies for Healthcare</text>
  <text x="55" y="76" class="subtitle">Emerging-technology-enabled tacit knowledge retention · bounded s003 case sample</text>

  <!-- Three analytical bands with equal 30 px gaps -->
  <rect x="35" y="105" width="1930" height="320" rx="18" fill="none" stroke="var(--band-stroke)" stroke-width="1.2"/>
  <text x="65" y="141" class="section-title">DEPENDENCIES RESHAPED BY DIGITAL CLINICAL PRACTICE</text>
  <text x="1935" y="141" text-anchor="end" class="section-note">ranked by evidence count · dashed links</text>

  <rect x="35" y="455" width="1930" height="380" rx="18" fill="none" stroke="var(--band-stroke)" stroke-width="1.2"/>
  <text x="65" y="492" class="section-title">TECHNOLOGY-ENABLED RETENTION PATHWAY</text>
  <text x="1935" y="492" text-anchor="end" class="section-note">practice indexes with bounded case evidence</text>

  <rect x="35" y="865" width="1930" height="360" rx="18" fill="none" stroke="var(--band-stroke)" stroke-width="1.2"/>
  <text x="65" y="902" class="section-title">PERSISTENTLY ESTABLISHED DEPENDENCIES IN HEALTHCARE OPERATIONS</text>
  <text x="1935" y="902" text-anchor="end" class="section-note">shared foundations · solid links</text>

  <!-- Digital-clinical dependency links -->
  <g class="relation-set" aria-label="D1 clinical scenario design">
    <path class="link link-digital d1" marker-end="url(#arrow-d1)" d="M235 395 C235 465 400 490 470 535"/>
    <path class="link link-digital d1" marker-end="url(#arrow-d1)" d="M235 395 C235 475 1290 480 1370 535"/>
  </g>
  <g class="relation-set" aria-label="D2 clinical evidence assurance">
    <path class="link link-digital d2" marker-end="url(#arrow-d2)" d="M613 395 C613 470 650 490 650 535"/>
    <path class="link link-digital d2" marker-end="url(#arrow-d2)" d="M613 395 C613 475 1450 480 1510 535"/>
  </g>
  <g class="relation-set" aria-label="D3 protected clinician knowledge engineer time">
    <path class="link link-digital d3" marker-end="url(#arrow-d3)" d="M991 395 C991 470 830 490 810 535"/>
    <path class="link link-digital d3" marker-end="url(#arrow-d3)" d="M991 395 C991 470 1600 485 1650 535"/>
  </g>
  <g class="relation-set" aria-label="D4 tactile spatial and multi-user fidelity">
    <path class="link link-digital d4" marker-end="url(#arrow-d4)" d="M1369 395 C1369 470 970 490 940 535"/>
    <path class="link link-digital d4" marker-end="url(#arrow-d4)" d="M1369 395 C1369 470 1730 490 1770 535"/>
  </g>
  <g class="relation-set" aria-label="D5 immersive exposure safeguards">
    <path class="link link-digital d5" marker-end="url(#arrow-d5)" d="M1747 395 C1747 470 1840 490 1840 535"/>
  </g>

  <!-- Persistent dependency links -->
  <g class="relation-set" aria-label="P1 licensed clinical authority and validation">
    <path class="link link-persistent p1" marker-end="url(#arrow-p1)" d="M235 965 C235 870 370 825 410 790"/>
    <path class="link link-persistent p1" marker-end="url(#arrow-p1)" d="M235 965 C235 850 1190 820 1260 790"/>
  </g>
  <g class="relation-set" aria-label="P2 clinical evidence assets and simulation equipment">
    <path class="link link-persistent p2" marker-end="url(#arrow-p2)" d="M613 965 C613 865 510 825 510 790"/>
    <path class="link link-persistent p2" marker-end="url(#arrow-p2)" d="M613 965 C613 855 1320 820 1380 790"/>
  </g>
  <g class="relation-set" aria-label="P3 curriculum-to-care integration">
    <path class="link link-persistent p3" marker-end="url(#arrow-p3)" d="M991 965 C991 865 620 825 610 790"/>
    <path class="link link-persistent p3" marker-end="url(#arrow-p3)" d="M991 965 C991 855 1440 820 1500 790"/>
  </g>
  <g class="relation-set" aria-label="P4 cross-setting access to biomedical resources">
    <path class="link link-persistent p4" marker-end="url(#arrow-p4)" d="M1369 965 C1369 860 730 825 710 790"/>
    <path class="link link-persistent p4" marker-end="url(#arrow-p4)" d="M1369 965 C1369 860 1570 825 1620 790"/>
  </g>
  <g class="relation-set" aria-label="P5 healthcare jurisdictional obligations">
    <path class="link link-persistent p5" marker-end="url(#arrow-p5)" d="M1747 965 C1747 860 840 825 810 790"/>
    <path class="link link-persistent p5" marker-end="url(#arrow-p5)" d="M1747 965 C1747 865 1710 825 1740 790"/>
  </g>

  <!-- Digitally reshaped dependency cards -->
  <g aria-label="Digitally reshaped dependency cards">
    <rect x="60" y="163" width="350" height="232" rx="13" class="card" stroke="var(--d1)"/>
    <text x="82" y="193" class="dep-code" fill="var(--d1)">D1 · #1</text><text x="388" y="193" text-anchor="end" class="score">44</text>
    <text x="82" y="225" class="dep-title">Clinical-scenario design preserving</text>
    <text x="82" y="248" class="dep-title">spatial anatomy, procedural judgement</text>
    <text x="82" y="271" class="dep-title">and hazard consequences</text>
    <text x="82" y="315" class="dep-note">spatial fidelity · adaptive instruction · transfer</text>
    <text x="82" y="365" class="dep-ids">Primary ID: LI04</text>

    <rect x="438" y="163" width="350" height="232" rx="13" class="card" stroke="var(--d2)"/>
    <text x="460" y="193" class="dep-code" fill="var(--d2)">D2 · #2</text><text x="766" y="193" text-anchor="end" class="score">42</text>
    <text x="460" y="225" class="dep-title">Clinical-evidence assurance across</text>
    <text x="460" y="248" class="dep-title">federated data, physiological models</text>
    <text x="460" y="271" class="dep-title">and disease-specific knowledge graphs</text>
    <text x="460" y="315" class="dep-note">validity · bias testing · semantics · traceability</text>
    <text x="460" y="365" class="dep-ids">Primary ID: LI05</text>

    <rect x="816" y="163" width="350" height="232" rx="13" class="card" stroke="var(--d3)"/>
    <text x="838" y="193" class="dep-code" fill="var(--d3)">D3 · #3</text><text x="1144" y="193" text-anchor="end" class="score">19</text>
    <text x="838" y="225" class="dep-title">Protected clinician–knowledge-engineer</text>
    <text x="838" y="248" class="dep-title">time for 3D models, annotation and</text>
    <text x="838" y="271" class="dep-title">registry interpretation</text>
    <text x="838" y="315" class="dep-note">protected workload · specialist support · review</text>
    <text x="838" y="365" class="dep-ids">Primary ID: LI08</text>

    <rect x="1194" y="163" width="350" height="232" rx="13" class="card" stroke="var(--d4)"/>
    <text x="1216" y="193" class="dep-code" fill="var(--d4)">D4 · #4</text><text x="1522" y="193" text-anchor="end" class="score">16</text>
    <text x="1216" y="225" class="dep-title">Tactile, spatial and multi-user fidelity</text>
    <text x="1216" y="248" class="dep-title">in headsets, wearable devices and</text>
    <text x="1216" y="271" class="dep-title">anatomical models</text>
    <text x="1216" y="315" class="dep-note">tactile cues · processing · devices · space</text>
    <text x="1216" y="365" class="dep-ids">Primary ID: LI06</text>

    <rect x="1572" y="163" width="350" height="232" rx="13" class="card" stroke="var(--d5)"/>
    <text x="1594" y="193" class="dep-code" fill="var(--d5)">D5 · #5</text><text x="1900" y="193" text-anchor="end" class="score">10</text>
    <text x="1594" y="225" class="dep-title">Physical and psychological exposure</text>
    <text x="1594" y="248" class="dep-title">safeguards for nuclear-safety and</text>
    <text x="1594" y="271" class="dep-title">overdose simulations</text>
    <text x="1594" y="315" class="dep-note">cybersickness · trauma awareness · ergonomics</text>
    <text x="1594" y="365" class="dep-ids">Primary ID: LI02</text>
  </g>

  <!-- Retention mechanisms -->
  <g aria-label="Digital Codification mechanism">
    <rect x="100" y="535" width="830" height="255" rx="16" class="mechanism-frame codification-frame"/>
    <text x="130" y="575" class="mechanism-title" fill="var(--codify)">DIGITAL CODIFICATION</text>
    <text x="130" y="603" class="mechanism-note">clinical experience converted into durable, searchable and verifiable representations</text>
    <circle cx="140" cy="634" r="5" fill="var(--codify)"/>
    <text x="157" y="640" class="mechanism-item">Spatial anatomical models and clinical-scenario representations</text>
    <text x="157" y="660" class="evidence-line">s003M01TP01 · c209;c224</text>
    <circle cx="140" cy="680" r="5" fill="var(--codify)"/>
    <text x="157" y="686" class="mechanism-item">Predictive, adaptive and generative clinical inference</text>
    <text x="157" y="706" class="evidence-line">s003M01TP07/08 · c201;c202;c203;c209;c212;c213;c214;c215;c221;c222</text>
    <circle cx="140" cy="726" r="5" fill="var(--codify)"/>
    <text x="157" y="732" class="mechanism-item">Medical knowledge graphs, archives, assessment and provenance</text>
    <text x="157" y="752" class="evidence-line">s003M01TP09/10/13/15 · c201;c205;c213;c214;c218;c219;c221;c222;c224;c227</text>
  </g>

  <g aria-label="Experiential Amplification mechanism">
    <rect x="1070" y="535" width="830" height="255" rx="16" class="mechanism-frame experience-frame"/>
    <text x="1100" y="575" class="mechanism-title" fill="var(--experience)">EXPERIENTIAL AMPLIFICATION</text>
    <text x="1100" y="603" class="mechanism-note">situated clinical rehearsal, consequence feedback and shared interpretation</text>
    <circle cx="1110" cy="634" r="5" fill="var(--experience)"/>
    <text x="1127" y="640" class="mechanism-item">Immersive anatomy, nuclear-safety, overdose and disaster rehearsal</text>
    <text x="1127" y="660" class="evidence-line">s003M01TP03 · c207;c212;c214;c216;c225</text>
    <circle cx="1110" cy="680" r="5" fill="var(--experience)"/>
    <text x="1127" y="686" class="mechanism-item">Interactive diagnostic prompting and consequence feedback</text>
    <text x="1127" y="706" class="evidence-line">s003M01TP04 · c201;c212</text>
    <circle cx="1110" cy="726" r="5" fill="var(--experience)"/>
    <text x="1127" y="732" class="mechanism-item">Collaborative, multimedia and blended clinical learning</text>
    <text x="1127" y="752" class="evidence-line">s003M01TP11/12 · c204;c205;c208;c210;c211;c217;c218;c219;c224</text>
  </g>

  <!-- Persistently established dependency cards -->
  <g aria-label="Persistent healthcare dependency cards">
    <rect x="60" y="965" width="350" height="225" rx="13" class="card" stroke="var(--p1)"/>
    <text x="82" y="995" class="dep-code" fill="var(--p1)">P1 · #1</text><text x="388" y="995" text-anchor="end" class="score">16</text>
    <text x="82" y="1027" class="dep-title">Licensed clinical authority and</text>
    <text x="82" y="1050" class="dep-title">multidisciplinary expert validation</text>
    <text x="82" y="1094" class="dep-note">licensure · experience · curriculum validation</text>
    <text x="82" y="1158" class="dep-ids">Primary ID: OD05</text>

    <rect x="438" y="965" width="350" height="225" rx="13" class="card" stroke="var(--p2)"/>
    <text x="460" y="995" class="dep-code" fill="var(--p2)">P2 · #2</text><text x="766" y="995" text-anchor="end" class="score">12</text>
    <text x="460" y="1027" class="dep-title">Reference-quality clinical evidence</text>
    <text x="460" y="1050" class="dep-title">assets and simulation equipment</text>
    <text x="460" y="1094" class="dep-note">labelled data · computing · headsets · models</text>
    <text x="460" y="1158" class="dep-ids">Primary ID: OD03</text>

    <rect x="816" y="965" width="350" height="225" rx="13" class="card" stroke="var(--p3)"/>
    <text x="838" y="995" class="dep-code" fill="var(--p3)">P3 · #3</text><text x="1144" y="995" text-anchor="end" class="score">10</text>
    <text x="838" y="1027" class="dep-title">Curriculum-to-care pathway integration</text>
    <text x="838" y="1050" class="dep-title">for nursing and safety education</text>
    <text x="838" y="1094" class="dep-note">curriculum alignment · role fit · compatibility</text>
    <text x="838" y="1158" class="dep-ids">Primary ID: OD08</text>

    <rect x="1194" y="965" width="350" height="225" rx="13" class="card" stroke="var(--p4)"/>
    <text x="1216" y="995" class="dep-code" fill="var(--p4)">P4 · #4</text><text x="1522" y="995" text-anchor="end" class="score">7</text>
    <text x="1216" y="1027" class="dep-title">Cross-setting access to biomedical</text>
    <text x="1216" y="1050" class="dep-title">resources, connectivity and devices</text>
    <text x="1216" y="1094" class="dep-note">cadavers · literature · internet · equipment</text>
    <text x="1216" y="1158" class="dep-ids">Primary ID: ED05</text>

    <rect x="1572" y="965" width="350" height="225" rx="13" class="card" stroke="var(--p5)"/>
    <text x="1594" y="995" class="dep-code" fill="var(--p5)">P5 · #5</text><text x="1900" y="995" text-anchor="end" class="score">6</text>
    <text x="1594" y="1027" class="dep-title">Patient-privacy, radiation-exposure</text>
    <text x="1594" y="1050" class="dep-title">and statutory service obligations</text>
    <text x="1594" y="1094" class="dep-note">ethics · privacy · radiation limits · wait-time law</text>
    <text x="1594" y="1158" class="dep-ids">Primary ID: ED01</text>
  </g>

  <!-- Legend and scope note -->
  <g aria-label="Legend and scope note">
    <line x1="65" y1="1270" x2="125" y2="1270" class="link link-digital d1" opacity="0.8"/>
    <text x="138" y="1275" class="legend">digitally reshaped clinical dependency</text>
    <line x1="420" y1="1270" x2="480" y2="1270" class="link link-persistent p1" opacity="0.8"/>
    <text x="493" y="1275" class="legend">persistent healthcare foundation</text>
    <text x="1935" y="1275" text-anchor="end" class="legend">Counts are evidence counts, not sector prevalence.</text>
  </g>
</svg>
