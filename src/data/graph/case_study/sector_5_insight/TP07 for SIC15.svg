</g>

<!-- 7 limitations -->
<rect class="p" x="35" y="1000" width="1630" height="275" rx="18"/><circle cx="62" cy="1027" r="15" fill="#cc6670"/><text class="n" x="58" y="1032">7</text><text class="h" x="86" y="1033">LIMITATIONS AND MITIGATION</text>
<g transform="translate(60 1065)">
