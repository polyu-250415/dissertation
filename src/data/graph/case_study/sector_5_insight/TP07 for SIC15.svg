<rect class="p" x="1235" y="105" width="430" height="300" rx="18"/><circle cx="1262" cy="132" r="15" fill="#8859c4"/><text class="n" x="1258" y="137">4</text><text class="h" x="1286" y="138">TACIT KNOWLEDGE CODIFIED</text>
