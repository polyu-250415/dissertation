<!-- 5 learners -->
<rect class="p" x="1210" y="430" width="455" height="305" rx="18"/><circle cx="1237" cy="457" r="15" fill="#48a76b"/><text class="n" x="1233" y="462">5</text><text class="h" x="1261" y="463">KNOWLEDGE LEARNERS</text>
<g transform="translate(1233 495)">
