<rect class="card tech" x="60" y="175" width="305" height="95"/><text class="name" x="78" y="205"><tspan>Artificial Intelligence and</tspan><tspan x="78" dy="17">Intelligent Computation</tspan></text><text class="meta" x="78" y="250">s001M01TE01 · n=26</text>
<text class="small" x="60" y="302">AI is adoption evidence; retention is inferred</text><text class="small" x="60" y="318">from the practice–knowledge relations below.</text>

<!-- 2 holders -->
<rect class="p" x="35" y="375" width="455" height="360" rx="18"/><circle cx="62" cy="402" r="15" fill="#d68b2c"/><text class="n" x="58" y="407">2</text><text class="h" x="86" y="408">KNOWLEDGE HOLDERS</text>
<g transform="translate(58 440)">
 <rect class="card holder" width="190" height="66"/><text class="name" x="10" y="22"><tspan>Frontline &amp; operational</tspan><tspan x="10" dy="15">practitioners</tspan></text><text class="meta" x="10" y="56">s001M01KH03 · n=8</text>
 <g transform="translate(205)"><rect class="card holder" width="190" height="66"/><text class="name" x="10" y="22"><tspan>Scientific, engineering &amp;</tspan><tspan x="10" dy="15">technical professionals</tspan></text><text class="meta" x="10" y="56">s001M01KH05 · n=9</text></g>
 <g transform="translate(0 82)"><rect class="card holder" width="190" height="66"/><text class="name" x="10" y="22">Domain experts &amp; reviewers</text><text class="meta" x="10" y="56">s001M01KH06 · n=9</text></g>
 <g transform="translate(205 82)"><rect class="card holder" width="190" height="66"/><text class="name" x="10" y="22"><tspan>Operational, project &amp;</tspan><tspan x="10" dy="15">middle managers</tspan></text><text class="meta" x="10" y="56">s001M01KH07 · n=15</text></g>
 <g transform="translate(0 164)"><rect class="card holder" width="190" height="66"/><text class="name" x="10" y="22">Executive &amp; strategic leadership</text><text class="meta" x="10" y="56">s001M01KH08 · n=7</text></g>
</g>

<!-- 3 central -->
<rect class="p" x="680" y="220" width="340" height="350" rx="18"/><circle cx="707" cy="247" r="15" fill="#172a46"/><text class="n" x="703" y="252">3</text><text class="h" x="731" y="253">CENTRAL PRACTICE</text>
<rect x="720" y="300" width="260" height="225" rx="20" fill="#172a46" stroke="#0d1b2e" stroke-width="2.5" filter="url(#s)"/>
<text x="850" y="335" text-anchor="middle" style="font:700 13px Arial;fill:#9ce1b8;letter-spacing:1px">DIGITAL CODIFICATION</text>
<text x="850" y="385" text-anchor="middle" style="font:700 22px Arial;fill:white"><tspan x="850">Algorithmic Pattern</tspan><tspan x="850" dy="30">Discovery and</tspan><tspan x="850" dy="30">Prediction</tspan></text>
<line x1="760" y1="465" x2="940" y2="465" stroke="#66809f"/><text x="850" y="492" text-anchor="middle" style="font:12px ui-monospace;fill:#d4e2f2">s001M01TP07 · n=16</text>

