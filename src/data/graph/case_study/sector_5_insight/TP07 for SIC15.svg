 <g transform="translate(208 67)"><rect class="card learner" width="195" height="56"/><text class="name" x="9" y="21">Upskilling practitioners</text><text class="meta" x="9" y="45">s001M01KL04 · n=5</text></g>
 <g transform="translate(0 134)"><rect class="card learner" width="195" height="56"/><text class="name" x="9" y="21">Frontline safety recipients</text><text class="meta" x="9" y="45">s001M01KL05 · n=2</text></g>
 <g transform="translate(208 134)"><rect class="card learner" width="195" height="56"/><text class="name" x="9" y="21">Decision/action learners</text><text class="meta" x="9" y="45">s001M01KL06 · n=3</text></g>
</g>

<!-- 6 dependencies -->
<rect class="p" x="400" y="790" width="900" height="180" rx="18"/><circle cx="427" cy="817" r="15" fill="#399994"/><text class="n" x="423" y="822">6</text><text class="h" x="451" y="823">CONTEXTUAL DEPENDENCIES</text>
<g transform="translate(425 855)">
 <rect class="card dep" width="200" height="65"/><text class="name" x="10" y="23">Strategic leadership</text><text class="meta" x="10" y="52">s001M01OD02 · n=11</text>
