 <g transform="translate(0 72)"><rect class="card dual" width="250" height="58"/><text class="name" x="9" y="21">Culture, leadership &amp; adoption</text><text class="meta" x="9" y="45">s001M01LI09 · n=25 · dual</text></g>
 <g transform="translate(262 72)"><rect class="card dual" width="250" height="58"/><text class="name" x="9" y="21">Continuity, governance &amp; privacy</text><text class="meta" x="9" y="45">s001M01LI10 · n=19 · dual</text></g>
 <g transform="translate(524 72)"><rect class="card lim" width="250" height="58"/><text class="name" x="9" y="21">Physical/operational variability</text><text class="meta" x="9" y="45">s001M01LI11 · n=8</text></g>
 <g transform="translate(786 72)"><rect class="card lim" width="250" height="58"/><text class="name" x="9" y="21">Measurement &amp; validation flaws</text><text class="meta" x="9" y="45">s001M01LI13 · n=10</text></g>
 <g transform="translate(1048 72)"><rect class="card lim" width="250" height="58"/><text class="name" x="9" y="21">Sample/generalizability limits</text><text class="meta" x="9" y="45">s001M01LI14 · n=5</text></g>
</g>
<text class="small" x="60" y="1238">Dual = direct constraint and mitigation target. LI08 is a mitigation target and also a tacit-knowledge capture barrier; mitigation does not establish elimination.</text>

