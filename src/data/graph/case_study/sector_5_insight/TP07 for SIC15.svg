 <style>
 .bg{fill:#f7f8fb}.p{fill:#fff;stroke:#98a5b5;stroke-width:1.5;stroke-dasharray:8 7}.h{font:700 15px Arial;fill:#263244;letter-spacing:.5px}.n{font:700 14px Arial;fill:white}.card{stroke-width:1.2;rx:9}.name{font:600 12px Arial;fill:#172033}.meta{font:10px ui-monospace,monospace;fill:#52606d}.tech{fill:#e7f0ff;stroke:#4f83cc}.holder{fill:#fff1dc;stroke:#d68b2c}.learner{fill:#e8f7ee;stroke:#48a76b}.tk{fill:#f1e9fc;stroke:#8859c4}.dep{fill:#e7f6f5;stroke:#399994}.lim{fill:#fff0f1;stroke:#cc6670}.dual{fill:#fff6da;stroke:#d09a22}.e{fill:none;stroke:#475569;stroke-width:1.7;marker-end:url(#a)}.eg{fill:none;stroke:#16803d;stroke-width:2;marker-end:url(#g)}.rl{font:600 10px Arial;fill:#475569;paint-order:stroke;stroke:#f7f8fb;stroke-width:4}.small{font:10.5px Arial;fill:#52606d}
 </style>
</defs>
<rect class="bg" width="1700" height="1400"/>
<text x="45" y="46" style="font:700 28px Georgia;fill:#172a46">Algorithmic Pattern Discovery and Prediction</text>
<text x="45" y="72" style="font:13px Arial;fill:#52606d">Evidence-grounded practice map · dominant mechanism: digital codification · Neo4j multi-case synthesis</text>

<!-- bundled relationships -->
<path class="e" d="M360 245C520 245 585 380 720 380"/><text class="rl" x="525" y="285">adopt</text>
<path class="e" d="M450 560C590 560 610 455 720 455"/><text class="rl" x="575" y="525">participate_in</text>
<path class="e" d="M980 390C1100 390 1130 255 1270 255"/><text class="rl" x="1060" y="310">be_captured_by / be_transferred_by</text>
<path class="e" d="M1270 560C1120 560 1100 455 980 455"/><text class="rl" x="1080" y="535">be_absorbed_by</text>
<path class="e" d="M850 525V805"/><text class="rl" x="862" y="700">depend_on</text>
<path class="e" d="M810 525C700 745 620 920 620 1010"/><text class="rl" x="650" y="860">be_constrained_by</text>
<path class="eg" d="M920 525C1080 760 1190 925 1190 1010"/><text class="rl" x="1080" y="860" style="fill:#16803d">mitigate</text>

<!-- 1 technology -->
