<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1400" viewBox="0 0 1700 1400" role="img" aria-labelledby="title desc">
<title id="title">Knowledge map: Algorithmic Pattern Discovery and Prediction</title>
<desc id="desc">Academic knowledge map with numbered dashed panels, central practice, technologies, actors, tacit knowledge, dependencies, limitations and mitigation.</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker>
 <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#16803d"/></marker>
